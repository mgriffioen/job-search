name: Update job listings

on:
  schedule:
    # 06:10 and 16:10 UTC ≈ 2:10am and 12:10pm Eastern.
    - cron: '10 6,16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/job-search-simplify-izo7cj
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/update-jobs.yml'

concurrency:
  group: update-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: npm test

      # Reports only whether each name is set, never its value. Catches the
      # usual misconfigurations: a typo'd secret name, or a value added under
      # the Variables tab / as an Environment secret, where the job cannot
      # reach it.
      - name: Check optional API keys
        env:
          # Booleans only — a secret's value is never exposed here.
          SECRET_RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY != '' }}
          SECRET_JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY != '' }}
          SECRET_ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID != '' }}
          SECRET_ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY != '' }}
          VAR_RAPIDAPI_KEY: ${{ vars.RAPIDAPI_KEY != '' }}
          VAR_JOOBLE_API_KEY: ${{ vars.JOOBLE_API_KEY != '' }}
          VAR_ADZUNA_APP_ID: ${{ vars.ADZUNA_APP_ID != '' }}
          VAR_ADZUNA_APP_KEY: ${{ vars.ADZUNA_APP_KEY != '' }}
        run: |
          keys="RAPIDAPI_KEY JOOBLE_API_KEY ADZUNA_APP_ID ADZUNA_APP_KEY"
          missing=""
          for key in $keys; do
            eval "is_secret=\$SECRET_${key}"
            [ "$is_secret" = "true" ] || missing="$missing $key"
          done

          # Report by exception: a healthy run says one line, a broken one
          # says which key is missing and whether it landed on the wrong tab.
          if [ -z "$missing" ]; then
            echo "All optional API keys are configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Optional API keys not visible to this workflow"
            echo ""
            echo "| Key | Saved as a Secret | Saved as a Variable instead |"
            echo "| --- | --- | --- |"
            for key in $missing; do
              eval "as_var=\$VAR_${key}"
              echo "| $key | false | $as_var |"
            done
            echo ""
            echo "Add each under **Settings → Secrets and variables → Actions → Secrets**."
            echo "A \`true\` in the last column means the value exists but was saved on the"
            echo "Variables tab — that is a separate store the workflow cannot read."
            echo ""
            echo "The affected source skips itself; every other source still runs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and match job postings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          # JSearch is the one metered source, and RapidAPI bills for every
          # request past the monthly quota. A push that edits a script should
          # not cost listings quota: the free boards still refresh, and the
          # next scheduled run picks JSearch back up within twelve hours.
          # Run it by hand from the Actions tab if a push needs it immediately.
          JSEARCH_ENABLED: ${{ github.event_name != 'push' }}
        run: npm run fetch

      - name: Commit updated listings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One board, two files.
          git add docs/data/jobs.json docs/data/meta.json
          if git diff --staged --quiet; then
            echo "No change in listings."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./docs/data/meta.json').counts.published)")
          git commit -m "Update job listings (${COUNT} matches)"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "Push failed, retrying in $((2 ** attempt))s…"
            sleep $((2 ** attempt))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "Could not push updated listings." >&2
          exit 1
